<!DOCTYPE htnl>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      profile card
    </title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <link rel="stylesheet" href="profilecard2.css">
  </head>
  <body>
    <div class="container">
      <div class="image">
        <img src="dreamwrld.png" alt="dreamwrld" class="avatar">
      </div>
      <div class="hero">
        <h1>Your Name</h1>
        <p>link in bio details</p>
      </div>
      <div class="buttons">
        <a href="#" target="_blank" class="message"   title="message me">Message Me</a>
        <a href="#" target="_blank" title="follow me">Follow Me</a>
      </div>
      <div class="icons">
        <a href="#" target="_blank" title="facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="#" target="_blank" title="whatsapp">
          <i class="fab fa-whatsapp"></i>
        </a>
        <a href="#" target="_blank" title="instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="#" target="_blank" title="tiktok">
          <i class="fab fa-tiktok"></i>
        </a>
      </div>
    </div>
  </body>
</html>
