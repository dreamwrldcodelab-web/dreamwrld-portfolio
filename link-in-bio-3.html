<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width"initial-scale=1.0>
    <title>linear card</title>
    <link rel="stylesheet" href="link-in-bio-3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </head>
  </head>
  <body>
    <div class="container">
      <div class="image">
        <img src="dreamwrld.png" class="avatar" alt="profile-image">
      </div>
      <div class="hero">
        <h1>Your Name</h1>
      <p>Bio information</p>
      </div>
      <div class="buttons">
        <a href="#" target="_blank">Hire Me  🚀</a>
        <a href="#"  target="_blank">View My Portfolio  💼</a>
        <a href="#" target="_blank">Book A Call  📞</a>
      </div>
      <div class="icons">
        <a href="#" target="_blank" title="youtube"> 
          <i class="fab fa-youtube"></i>
        </a>
        <a href="#" target="_blank" title="instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="#" target="_blank" title="facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="#" target="_blank" title="whatsapp">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>

      <div class="footer">
        <p>© 2026 dreamwrldcodelab. All rights reserved.</p>
      </div>
      

    </div>
  </body>
</html>
