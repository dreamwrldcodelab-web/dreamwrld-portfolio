<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset=UTF-8>
<meta name="viewport" content="width=device-width"initial-scale=1.0>
<title>
  profile card
</title>
<link rel="stylesheet" href="link-in-bio.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </head>
  <body>
    <div class="container">
      <div class="image">
        <img src="dreamwrld.png" alt="Profile Image" class="avatar">
      </div>
      <div class="hero">
        <h1>Your Name</h1>
        <p>Link in bio details</p>
      </div>
      <div class="buttons">
        <a href="#" target="_blank">Hire Me 🚀</a>
         <a href="#" target="_blank">View My Portfolio 💼</a>
          <a href="#" target="_blank">Book A Call 📞</a>
      </div>
      <div class="social-icons">
        <a href="http//youtube.com" target="_blank" title="go to youtube">
          <i class="fab fa-youtube"></i></a>
          <a href="http//facebook.com" target="_blank" title="go to facebook">
            <i class="fab fa-facebook"></i></a>
            <a href="http//instagram.com" target="_blank" title="go to instagram">
              <i class="fab fa-instagram"></i></a>
              <a href="http//twitter.com" target="_blank" title="go to twitter">
                <i class="fab fa-twitter"></i></a>
      </div>
      <div class="footer">
        <p>© 2024 dreamwrldcodelab. All rights reserved.</p>
    </div>
  </body>

</html>
